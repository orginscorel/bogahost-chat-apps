# Mağaza ekran görüntüleri: uygulamayı VITRIN kipinde (anonim örnek veri, ağ yok) iPhone/iPad simülatöründe ve
# Mac penceresinde çalıştırıp gerçek ekran görüntülerini alır. Elle tetiklenir; üretim derlemelerine dokunmaz.
name: vitrin

on:
  workflow_dispatch:
    inputs:
      ekranlar:
        description: 'Virgülle ekranlar'
        default: 'sohbetler,gorusme,butoi,ziyaretciler,raporlar,ozet'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.8'
  PAKET: com.bogahost.destek

jobs:
  vitrin:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/destek
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 seç
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

      # ---------- iPhone + iPad (simülatör) ----------
      - name: iOS simülatör derlemesi (vitrin)
        run: flutter build ios --simulator --debug --dart-define=VITRIN=true
      - name: Simülatör görüntüleri
        env:
          EKRANLAR: ${{ github.event.inputs.ekranlar }}
        run: |
          set -e
          mkdir -p ../../vitrin-cikti
          xcrun simctl list devices available -j > cihazlar.json
          sec() { python3 - "$1" <<'PY'
          import json,sys,re
          d=json.load(open('cihazlar.json'))['devices']; pat=re.compile(sys.argv[1]); best=None
          for rt,devs in d.items():
              if 'iOS' not in rt: continue
              for x in devs:
                  if x.get('isAvailable') and pat.search(x['name']):
                      key=(x['name'], rt)
                      if best is None or key>best[0]: best=(key,x['udid'],x['name'],rt)
          print(best[1] if best else '', best[2] if best else '', best[3] if best else '')
          PY
          }
          IPHONE=$(sec 'iPhone .*Pro Max$'); IPAD=$(sec 'iPad Pro 13-inch')
          echo "iPhone: $IPHONE"; echo "iPad: $IPAD"
          APP=build/ios/iphonesimulator/Runner.app
          cek() { # $1=udid $2=önek
            local U=$1 ON=$2
            xcrun simctl boot "$U" || true
            xcrun simctl bootstatus "$U" -b
            xcrun simctl status_bar "$U" override --time 9:41 --batteryState discharging --batteryLevel 100 --cellularBars 4 --wifiBars 3 --operatorName '' || true
            xcrun simctl install "$U" "$APP"
            sleep 3
            for E in $(echo "$EKRANLAR" | tr ',' ' '); do
              D=$(xcrun simctl get_app_container "$U" "$PAKET" data); mkdir -p "$D/Documents"; echo "$E" > "$D/Documents/vitrin-ekran.txt"
              SIMCTL_CHILD_VITRIN_EKRAN=$E xcrun simctl launch "$U" "$PAKET" -flutter.vitrin_ekran "$E"
              sleep 12
              xcrun simctl io "$U" screenshot --type=png "../../vitrin-cikti/$ON-$E.png"
              xcrun simctl terminate "$U" "$PAKET" || true
              sleep 1
            done
            xcrun simctl shutdown "$U" || true
          }
          cek "$(echo $IPHONE | awk '{print $1}')" iphone
          cek "$(echo $IPAD | awk '{print $1}')" ipad
          ls -la ../../vitrin-cikti

      # ---------- Mac ----------
      - name: Mac derlemesi (vitrin)
        run: flutter build macos --release --dart-define=VITRIN=true
      - name: Mac görüntüleri
        env:
          EKRANLAR: ${{ github.event.inputs.ekranlar }}
        run: |
          set -e
          BIN="build/macos/Build/Products/Release/Bogahost Chat.app/Contents/MacOS/Bogahost Chat"
          [ -x "$BIN" ] || BIN=$(find build/macos/Build/Products/Release -path '*/Contents/MacOS/*' -type f | head -1)
          echo "ikili: $BIN"
          for E in $(echo "$EKRANLAR" | tr ',' ' '); do
            rm -f "$HOME"/Library/Containers/$PAKET/Data/Library/Application\ Support/*/vitrin-$E.png 2>/dev/null || true
            VITRIN_EKRAN=$E "$BIN" >/dev/null 2>&1 &
            PID=$!
            F=""
            for i in $(seq 1 45); do
              F=$(find "$HOME/Library/Containers/$PAKET" "$HOME/Library/Application Support" -name "vitrin-$E.png" 2>/dev/null | head -1)
              [ -n "$F" ] && break; sleep 1
            done
            if [ -n "$F" ]; then cp "$F" "../../vitrin-cikti/mac-$E.png"; echo "mac-$E: $F"; else echo "::warning::mac-$E alınamadı"; screencapture -x "../../vitrin-cikti/mac-$E-tamekran.png" || true; fi
            kill $PID 2>/dev/null || true; sleep 1
          done
          ls -la ../../vitrin-cikti
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitrin-${{ github.run_number }}
          path: vitrin-cikti/*.png
          if-no-files-found: warn
